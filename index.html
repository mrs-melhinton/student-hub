<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Student Hub</title>
<style>
:root{
  --bg:#f5f6f2; --card:#ffffff; --ink:#1f2933; --muted:#5d6872; --line:#dde2dd;
  --accent:#2d6886; --accent-ink:#ffffff; --accent-soft:#e2edf2;
  --miss:#b03a2e; --miss-soft:#f8e7e4; --unk:#5b626b; --unk-soft:#eceef0;
  --fu:#2c7466; --fu-soft:#e1f0ec; --todo:#8a6414; --todo-soft:#f6eedb;
  --ok:#2e7543; --ok-soft:#e3f1e6; --dot:#d2462f; --me:#eef3f6; --kid:#f3f1ea;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#14181c; --card:#1c2228; --ink:#e7ebee; --muted:#9ba6b0; --line:#2d353d;
  --accent:#86b9d4; --accent-ink:#10181d; --accent-soft:#1f3340;
  --miss:#f0938a; --miss-soft:#3a2220; --unk:#b6bcc4; --unk-soft:#262c33;
  --fu:#7fcdbd; --fu-soft:#183029; --todo:#e3bd6b; --todo-soft:#33291a;
  --ok:#8ed3a0; --ok-soft:#1a2f20; --dot:#ff7a62; --me:#1f2a31; --kid:#262520;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(48px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.5rem;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.1rem;margin:0}
h3{font-size:.85rem;margin:18px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
a{color:var(--accent)}
p{margin:0}
.muted{color:var(--muted)}
.top{display:flex;flex-direction:column;gap:12px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.switch{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.switch button{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:600;padding:10px 8px;border-radius:10px;min-height:48px;cursor:pointer}
.switch button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.95rem;padding:8px 14px;border-radius:999px;min-height:44px;cursor:pointer;white-space:nowrap}
.tabs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85em;margin-left:4px}
.udot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--dot);margin-left:6px;vertical-align:middle}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px}
.card>div{min-width:0}
.c-due:empty{display:none}
.c-due .chip{margin-top:4px}
.chip.rev{background:var(--miss-soft);color:var(--miss)}
.none-cls{display:none}
.none{color:var(--muted);font-size:.9rem;font-style:italic;margin:0}
.newtag{display:inline-block;background:var(--dot);color:#fff;border-radius:6px;padding:0 6px;font-size:.72rem;font-weight:700}
.main{display:flex;flex-direction:column;gap:22px}
.sect{display:flex;flex-direction:column}
.secth{font-size:1.25rem;margin:4px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.panel.sort{border-color:var(--accent)}
.small{font-size:.92rem}
.sent{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.sent-h{font-size:.85rem;font-weight:600;color:var(--muted)}
.sortone{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.pick{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pick legend{font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:4px}
.pick label{display:flex;gap:10px;align-items:flex-start;font-size:.98rem;padding:6px 8px;border-radius:8px;background:var(--bg);cursor:pointer;min-height:44px}
.pick input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--accent)}
.thead{display:none}
@media (min-width:900px){
  .wrap{max-width:1180px}
  .thead{display:grid;grid-template-columns:190px minmax(0,1.1fr) 140px minmax(0,1.6fr);column-gap:18px;padding:0 15px 6px 19px;font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .card:not(.addcard){display:grid;grid-template-columns:190px minmax(0,1.1fr) 140px minmax(0,1.6fr);column-gap:18px;row-gap:8px;align-items:start}
  .card .c-due:empty{display:block}
  .none-cls{display:block;color:var(--muted)}
  .c-talk.thread{border-top:0;padding-top:0;margin-top:0}
  .c-compose{grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px}
}
.card.missing{border-left-color:var(--miss)} .card.unknown{border-left-color:var(--unk)}
.card.followup{border-left-color:var(--fu)} .card.todo{border-left-color:var(--todo)}
.card.college,.card.other{border-left-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:10px}
.cls{font-size:1.15rem;font-weight:700;color:var(--ink);line-height:1.3;overflow-wrap:anywhere}
.name{font-size:1rem;color:var(--ink);overflow-wrap:anywhere}
.name a{text-decoration:none}
.meta{font-size:.92rem;color:var(--muted)}
.detail{font-size:.95rem;overflow-wrap:anywhere}
.chip{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--todo-soft);color:var(--todo)}
.toggle{align-self:flex-start;border:0;background:transparent;color:var(--accent);font:inherit;font-size:.95rem;font-weight:600;padding:6px 0;min-height:40px;cursor:pointer}
.thread{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.msg{border-radius:10px;padding:9px 12px;font-size:.98rem;overflow-wrap:anywhere}
.msg.parent{background:var(--me)}
.msg.kid{background:var(--kid)}
.msg.status{background:var(--ok-soft);color:var(--ok);font-weight:600;font-size:.92rem}
.who{display:block;font-size:.78rem;color:var(--muted);font-weight:600;margin-bottom:2px}
.msg.status .who{display:inline;margin:0 0 0 4px;font-weight:400}
.tx{font-size:.88rem;color:var(--muted);margin-top:4px}
audio{width:100%;margin-top:6px}
textarea,input[type=text],input[type=date],input[type=email],select{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;font-size:1rem;padding:10px 16px;border-radius:10px;min-height:46px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{font-size:.9rem;min-height:38px;padding:6px 12px}
.btn.rec{border-color:var(--miss);color:var(--miss);background:transparent}
.btn.recording{background:var(--miss);color:#fff;border-color:var(--miss)}
.btn:disabled{opacity:.5;cursor:default}
.composer,.statusbox,.form{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.statusbox{border-top:1px dashed var(--line);padding-top:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted);font-weight:600}
.warn{background:var(--todo-soft);color:var(--todo);border-radius:10px;padding:10px 12px;font-size:.95rem}
.notice{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.95rem;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.notice button{border:0;background:transparent;font:inherit;color:var(--muted);cursor:pointer}
.empty{color:var(--muted);font-style:italic;padding:8px 2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.95rem;padding:8px 14px;border-radius:999px;min-height:44px;cursor:pointer}
.filter[aria-pressed="true"]{border-color:var(--miss);background:var(--miss-soft);color:var(--miss);font-weight:600}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.82rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:300px;overflow:auto;margin:0}
.signin{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.loading{color:var(--muted);text-align:center;padding:40px 0}
.secttl{display:flex;align-items:baseline;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.95rem;cursor:pointer;background:var(--bg);min-height:40px}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg input{accent-color:var(--accent);margin:0}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="loading">Loading…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
"use strict";
// ---------- settings (publishable key only; no tokens or secret keys live in this file) ----------
const SB_URL = "https://moznvnejdjhwawbsyqvi.supabase.co";
const SB_KEY = "sb_publishable_rYolPZhV_rye_bKMlanOZQ_ML73btgI";
const SITE = location.origin + location.pathname;
const PARENT_EMAIL = "melissa.hinton1@gmail.com";

const STUDENTS = ["Kyan", "Mckinley"];
const CLASS_ORDER = {
  Mckinley: ["Calculus", "AP Biology", "Physics in the Universe", "UW Psychology 101", "ENGL 131"],
  Kyan: ["Chemistry in Earth System", "Biotechnology I", "English 10", "Pre-Calculus", "World History 10"]
};
const SECTIONS = { Mckinley: ["todo", "mu", "followup", "college", "other"], Kyan: ["todo", "mu", "followup", "other"] };
const SEC_LABEL = { todo: "📝 To Do", mu: "🔴 Missing & ⚫ Unknown", followup: "🔁 Follow Up", college: "🎓 College Apps", other: "🗂 Other" };
const STATUSES = ["student says done", "I confirm done", "plan note", "status note", "settled: done", "excused", "no count"];
const NOTE_STATUSES = ["plan note", "status note"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "June", "July", "Aug", "Sept", "Oct", "Nov", "Dec"];

// ---------- Copy for ledger: same line format as the Feedback Ledger's "Copy new answers" ----------
// LEDGER-BEGIN
const LEDGER_STUDENTS = ["Mckinley", "Kyan"];
function ledgerPart(item, m) {
  const words = String(m.body || "").replace(/\s+/g, " ").trim();
  const note = words ? `notes (${m.note_by === "parent" ? "parent" : "student"}): ${words}` : "";
  let base;
  switch (m.status) {
    case "student says done": base = "done (student)"; break;
    case "I confirm done": base = "done (parent)"; break;
    case "plan note": return `${note}; note kind: plan`;
    case "status note": return `${note}; note kind: status`;
    case "settled: done": base = "settled: done (parent)"; break;
    case "excused": base = item.section === "followup" ? "settled: excused (parent)" : "excused by parent (doesn't have to be done; still graded)"; break;
    case "no count": base = "no count (parent)"; break;
    default: return null;
  }
  return note ? `${base}; ${note}` : base;
}
function ledgerPending(itemsById, msgs) {
  return msgs.filter(m => m.kind === "status" && !m.copied_at && itemsById[m.item_id] && itemsById[m.item_id].origin === "tracker")
    .sort((a, b) => String(a.created_at).localeCompare(String(b.created_at)));
}
function ledgerText(itemsById, pending, now) {
  const stamp = now.toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
  let out = `FEEDBACK LEDGER UPDATES — copied ${stamp}\nEach line starts with the tracker row ID.\n`;
  LEDGER_STUDENTS.forEach(st => {
    const lines = pending.filter(m => itemsById[m.item_id].student === st).map(m => {
      const it = itemsById[m.item_id];
      return `- [${it.id}] ${it.cls} — ${it.name}: ${ledgerPart(it, m)}`;
    });
    if (lines.length) out += `\n${st.toUpperCase()}\n` + lines.join("\n") + "\n";
  });
  return out;
}
// LEDGER-END

// ---------- mode: the family token lives only after the # in the link ----------
const hashParams = new URLSearchParams(location.hash.replace(/^#/, ""));
const TOKEN = hashParams.get("t");
const MODE = TOKEN ? "kid" : "parent";
// Preview: the kids' view, read-only (add &preview=1 to the family link). Nothing is sent or marked read.
const PREVIEW = MODE === "kid" && hashParams.get("preview") === "1";
const sb = supabase.createClient(SB_URL, SB_KEY, MODE === "kid"
  ? { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } }
  : { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "implicit", storageKey: "student-hub-auth" } });

// ---------- state ----------
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const S = {
  phase: "loading", items: [], msgs: [], student: STUDENTS.includes(ls.get("hub-student")) ? ls.get("hub-student") : "Kyan",
  open: new Set(), review: false, drafts: {}, notice: "", general: "", applySel: {},
  statusSel: {}, noteText: {}, noteBy: {}, speaker: {}, editing: null, adding: null, clipUrls: {}, fallback: null, session: null, err: ""
};
const MIC_TIP = "Tip: tap the 🎤 on your keyboard to talk instead of type.";

// ---------- helpers ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const br = s => esc(s).replace(/\n/g, "<br>");
const rank = (st, c) => { const i = (CLASS_ORDER[st] || []).indexOf(c); return i < 0 ? 99 : i; };
const secOf = i => (i.section === "missing" || i.section === "unknown") ? "mu" : i.section;
const sid = id => String(id).replace(/[^A-Za-z0-9_-]/g, "_");
function when(ts) {
  const d = new Date(ts); let h = d.getHours(); const ap = h < 12 ? "am" : "pm"; h = h % 12 || 12;
  return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${h}:${String(d.getMinutes()).padStart(2, "0")}${ap}`;
}
function weekday(sort) { const d = new Date(sort + "T12:00:00"); return isNaN(d) ? "" : d.toLocaleDateString("en-US", { weekday: "short" }) + ", "; }
function dueText(dateStr) { if (!dateStr) return ""; const [y, m, d] = dateStr.split("-").map(Number); return `${MONTHS[m - 1]} ${d}`; }
const byName = (a, b) => a.name.localeCompare(b.name);
const bySort = (a, b) => String(a.sort).localeCompare(String(b.sort)) || rank(a.student, a.cls) - rank(b.student, b.cls) || byName(a, b);
const byCourse = (a, b) => rank(a.student, a.cls) - rank(b.student, b.cls) || String(a.cls || "").localeCompare(String(b.cls || "")) || String(a.sort).localeCompare(String(b.sort)) || byName(a, b);
const live = i => i.active !== false && !i.archived_at;
const threadOf = id => S.msgs.filter(m => m.item_id === id);
// replies about several items (not tied to one item)
const generalOf = st => S.msgs.filter(m => !m.item_id && m.kind === "reply" && m.student === st);
const unsortedOf = st => generalOf(st).filter(m => !m.sorted_at);
const copiesOf = gid => S.msgs.filter(m => m.applied_from === gid && m.item_id);
function unreadOf(id) {
  return threadOf(id).filter(m => MODE === "kid" ? (m.author === "parent" && !m.read_by_student_at) : (m.kind === "reply" && !m.read_by_parent_at)).length;
}
function lastReply(id) { const r = threadOf(id).filter(m => m.kind === "reply"); return r[r.length - 1] || null; }
function needsReview(id) {
  // replies Melissa typed in herself don't need her review; replies she sorted onto this item do
  const t = threadOf(id); const r = t.filter(m => m.kind === "reply" && (m.entered_by !== "parent" || m.applied_from)); if (!r.length) return false;
  const s = t.filter(m => m.kind === "status");
  return !s.length || r[r.length - 1].created_at > s[s.length - 1].created_at;
}
const itemsOf = st => S.items.filter(i => live(i) && i.student === st);
function notice(t) { S.notice = t; render(); }
function byId() { const o = {}; S.items.forEach(i => { o[i.id] = i; }); return o; }

// ---------- data ----------
async function load() {
  try {
    if (MODE === "kid") {
      const [a, b] = await Promise.all([sb.rpc("kid_items", { p_token: TOKEN }), sb.rpc("kid_messages", { p_token: TOKEN })]);
      const e = a.error || b.error;
      if (e) { S.phase = /invalid family link/i.test(e.message || "") ? "badlink" : "error"; S.err = e.message || ""; render(); return; }
      S.items = a.data || []; S.msgs = b.data || [];
    } else {
      const [a, b] = await Promise.all([sb.from("items").select("*"), sb.from("messages").select("*").order("created_at")]);
      const e = a.error || b.error;
      if (e) { S.phase = "error"; S.err = e.message || ""; render(); return; }
      if (!a.data.length) { S.phase = "notparent"; render(); return; }
      S.items = a.data; S.msgs = b.data;
    }
    S.phase = "ready";
  } catch (e) { S.phase = "error"; S.err = String(e && e.message || e); }
  render();
  if (MODE === "parent") loadClips();
}

// Old voice clips (from before recording was turned off) still play in my view.
async function loadClips() {
  const ids = new Set(itemsOf(S.student).map(i => i.id));
  const need = S.msgs.filter(m => m.audio_path && ids.has(m.item_id) && !(S.clipUrls[m.id] && S.clipUrls[m.id].exp > Date.now()));
  for (const m of need) {
    const { data } = await sb.storage.from("voice-clips").createSignedUrl(m.audio_path, 3600);
    if (data && data.signedUrl) {
      S.clipUrls[m.id] = { url: data.signedUrl, exp: Date.now() + 50 * 60 * 1000 };
      const el = document.getElementById("clip-" + m.id); if (el) el.src = data.signedUrl;
    }
  }
}

// quiet = mark read without redrawing (used when a row has been on screen a moment)
async function markRead(id, quiet) {
  if (PREVIEW || !unreadOf(id)) return;
  const t = new Date().toISOString();
  if (MODE === "kid") {
    const { error } = await sb.rpc("kid_mark_read", { p_token: TOKEN, p_item_id: id });
    if (!error) S.msgs.forEach(m => { if (m.item_id === id && m.author === "parent" && !m.read_by_student_at) m.read_by_student_at = t; });
  } else {
    const ids = threadOf(id).filter(m => m.kind === "reply" && !m.read_by_parent_at).map(m => m.id);
    const { error } = await sb.from("messages").update({ read_by_parent_at: t }).in("id", ids);
    if (!error) S.msgs.forEach(m => { if (ids.includes(m.id)) m.read_by_parent_at = t; });
  }
  if (!quiet) render();
}

// ---------- rendering ----------
let obs = null; const seenTimers = {};
function watchUnread() {
  if (obs) obs.disconnect();
  Object.keys(seenTimers).forEach(k => { clearTimeout(seenTimers[k]); delete seenTimers[k]; });
  if (PREVIEW || !("IntersectionObserver" in window)) return;
  obs = new IntersectionObserver(es => es.forEach(e => {
    const id = e.target.dataset.unread;
    if (e.isIntersecting) { if (!seenTimers[id]) seenTimers[id] = setTimeout(() => { delete seenTimers[id]; markRead(id, true); }, 2000); }
    else { clearTimeout(seenTimers[id]); delete seenTimers[id]; }
  }), { threshold: 0.5 });
  document.querySelectorAll("[data-unread]").forEach(el => obs.observe(el));
}

function render() {
  const app = document.getElementById("app");
  const f = document.activeElement; const fid = f && f.id; const sel = f && "selectionStart" in f ? [f.selectionStart, f.selectionEnd] : null;
  app.innerHTML = view();
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
  Object.entries(S.clipUrls).forEach(([id, c]) => { const el = document.getElementById("clip-" + id); if (el && !el.src) el.src = c.url; });
  if (S.phase === "ready") watchUnread();
}

function view() {
  const head = `<header class="top"><div class="topline"><h1>Student Hub${MODE === "parent" ? " <span class='muted' style='font-weight:400;font-size:.95rem'>· my view</span>" : ""}</h1>${
    MODE === "parent" && S.session ? `<div class="bar"><button class="btn ghost small" data-act="refresh">↻ Refresh</button><button class="btn ghost small" data-act="signout">Sign out</button></div>` :
    MODE === "kid" && S.phase === "ready" ? `<button class="btn ghost small" data-act="refresh">↻ Refresh</button>` : ""}</div>`;
  const nt = S.notice ? `<div class="notice" role="status"><span>${esc(S.notice)}</span><button data-act="dismiss" aria-label="Dismiss">✕</button></div>` : "";
  if (S.phase === "loading") return head + `</header><p class="loading">Loading…</p>`;
  if (S.phase === "signin") return head + `</header>` + nt + signinView();
  if (S.phase === "badlink") return head + `</header><div class="warn">This link doesn't work anymore. Ask Mom for the new link.</div>`;
  if (S.phase === "notparent") return head + `</header><div class="warn">This account can't use the hub. Sign out and use ${esc(PARENT_EMAIL)}.</div>`;
  if (S.phase === "error") return head + `</header><div class="warn">Couldn't load the hub. Check your connection and tap Refresh.<br><small>${esc(S.err)}</small></div>`;

  const st = S.student;
  const sw = `<div class="switch" role="group" aria-label="Student">${STUDENTS.map(s => {
    const n = MODE === "kid" ? itemsOf(s).reduce((t, i) => t + unreadOf(i.id), 0) : itemsOf(s).filter(i => needsReview(i.id)).length + unsortedOf(s).length;
    return `<button data-act="sw" data-st="${s}" aria-pressed="${s === st}">${s}${n ? `<span class="udot" aria-label="${n} new"></span>` : ""}</button>`;
  }).join("")}</div>`;
  let bar = "";
  if (MODE === "parent") {
    const nRev = itemsOf(st).filter(i => needsReview(i.id)).length;
    const pend = ledgerPending(byId(), S.msgs).length;
    bar = `<div class="bar"><button class="filter" data-act="review" aria-pressed="${S.review}">Needs my review <span class="count">${nRev}</span></button>
      <button class="btn small" data-act="copyledger" ${pend ? "" : "disabled"}>Copy for ledger (${pend})</button></div>`;
  }
  const fb = S.fallback ? `<div class="warn">Your browser blocked copying. Select the text below and copy it, then tap "I copied it".
    <pre id="fbtext">${esc(S.fallback.text)}</pre><div class="row" style="margin-top:8px"><button class="btn small" data-act="markcopied">I copied it — mark as copied</button><button class="btn ghost small" data-act="cancelcopy">Cancel</button></div></div>` : "";
  const pv = PREVIEW ? `<div class="warn"><strong>Preview</strong> — this is what Kyan and Mckinley see. Replies are off, and nothing is marked as read.</div>` : "";
  const top = MODE === "kid" ? generalBox(st) : sortBox(st);
  return head + pv + sw + bar + `</header>` + nt + fb + `<main class="main">${top}${allView(st)}</main>`;
}

function signinView() {
  return `<div class="signin"><h2>Sign in</h2><p class="muted">We'll email you a sign-in link. You stay signed in on this device.</p>
    <label class="f">Email<input type="email" id="email" value="${esc(PARENT_EMAIL)}" autocomplete="email"></label>
    <button class="btn" data-act="signin">Email me a sign-in link</button></div>`;
}

// ---------- kids: one reply about any of the items ----------
function generalBox(st) {
  const mine = generalOf(st).slice().reverse().slice(0, 5);
  const past = mine.length ? `<div class="sent"><div class="sent-h">Your recent replies</div>${mine.map(m => {
    const on = copiesOf(m.id).map(c => S.items.find(i => i.id === c.item_id)).filter(Boolean);
    const state = m.sorted_at
      ? `✔ Mom sorted this${on.length ? ` onto: ${on.map(i => esc((i.cls ? i.cls + " — " : "") + i.name)).join("; ")}` : ""}`
      : "Waiting for Mom";
    return `<div class="msg kid"><span class="who">${esc(st)} · ${when(m.created_at)}</span>${br(m.body)}<div class="tx">${state}</div></div>`;
  }).join("")}</div>` : "";
  const box = PREVIEW
    ? `<p class="tx">Replies are turned off in preview. Here, ${esc(st)} sees a box to reply about any of the items.</p>`
    : `<label class="f" for="general">Reply about any of these, as ${esc(st)}</label>
      <textarea id="general" data-general="1" placeholder="e.g. Turned in the chem lab, still working on the map project…">${esc(S.general)}</textarea>
      <div class="row"><button class="btn" data-act="gsend">Send</button></div>
      <div class="tx">${MIC_TIP}</div>`;
  return `<section class="panel"><h2>💬 Reply about any of these</h2><p class="muted small">One reply can cover as many items as you want. Mom will match it to the right items.</p>${box}${past}</section>`;
}

// ---------- me: replies about several items, waiting to be sorted onto items ----------
function sortBox(st) {
  const list = unsortedOf(st);
  if (!list.length) return "";
  const items = itemsOf(st);
  return `<section class="panel sort"><h2>📥 Replies to sort <span class="count">${list.length}</span></h2>
    <p class="muted small">Tick the items each reply is about, then tap Apply. The reply is copied onto those items, and they show "Needs review" so you can set a status.</p>
    ${list.map(g => {
      const sel = S.applySel[g.id] || new Set();
      const checks = SECTIONS[st].map(k => {
        const l = items.filter(i => secOf(i) === k).sort(k === "todo" ? bySort : byCourse);
        if (!l.length) return "";
        return `<fieldset class="pick"><legend>${esc(SEC_LABEL[k])}</legend>${l.map(i =>
          `<label><input type="checkbox" data-pick="${esc(g.id)}" value="${esc(i.id)}" ${sel.has(i.id) ? "checked" : ""}>
           <span>${i.cls ? `<strong>${esc(i.cls)}</strong> — ` : ""}${esc(i.name)}${i.due ? ` <span class="muted">(${esc(i.due)})</span>` : ""}</span></label>`).join("")}</fieldset>`;
      }).join("");
      return `<div class="sortone"><div class="msg kid"><span class="who">${esc(st)} · ${when(g.created_at)}</span>${br(g.body)}</div>
        ${checks}
        <div class="row"><button class="btn" data-act="apply" data-id="${esc(g.id)}" ${sel.size ? "" : "disabled"}>Apply to ${sel.size} item${sel.size === 1 ? "" : "s"}</button>
        <button class="btn ghost small" data-act="sortnone" data-id="${esc(g.id)}">Not about an item — mark sorted</button></div></div>`;
    }).join("")}</section>`;
}

// ---------- one page: every section, as one table ----------
function allView(st) {
  const shown = itemsOf(st).filter(i => !S.review || needsReview(i.id));
  if (S.review && !shown.length) return `<p class="empty">Nothing waiting for review for ${esc(st)}.</p>`;
  const thead = `<div class="thead" aria-hidden="true"><span>Course</span><span>Assignment</span><span>Due</span><span>Messages</span></div>`;
  return SECTIONS[st].map(k => {
    const list = shown.filter(i => secOf(i) === k);
    if (S.review && !list.length) return "";
    let html = `<section class="sect"><h2 class="secth">${esc(SEC_LABEL[k])} <span class="count">${list.length}</span></h2>`;
    if (MODE === "parent" && !S.review && (k === "college" || k === "other")) html += addForm(st, k);
    if (!list.length) return html + `<p class="empty">None</p></section>`;
    html += thead + groups(k, list).map(g => (g.title ? `<h3>${esc(g.title)}</h3>` : "") + `<div class="list">${g.items.map(card).join("")}</div>`).join("");
    return html + `</section>`;
  }).join("");
}

function groups(k, list) {
  if (k === "todo") {
    const out = []; const rem = list.filter(i => i.reminder).sort(bySort);
    if (rem.length) out.push({ title: "Study reminders", items: rem });
    const dated = list.filter(i => !i.reminder && i.due);
    [...new Set(dated.map(i => i.sort))].sort().forEach(s => {
      const g = dated.filter(i => i.sort === s).sort((a, b) => rank(a.student, a.cls) - rank(b.student, b.cls) || byName(a, b));
      out.push({ title: weekday(s) + g[0].due, items: g });
    });
    const und = list.filter(i => !i.reminder && !i.due).sort((a, b) => rank(a.student, a.cls) - rank(b.student, b.cls) || byName(a, b));
    if (und.length) out.push({ title: "Undated", items: und });
    return out;
  }
  if (k === "mu" || k === "followup") return [{ title: "", items: list.slice().sort(byCourse) }];
  return [{ title: "", items: list.slice().sort((a, b) => String(a.sort).localeCompare(String(b.sort)) || byName(a, b)) }];
}

function card(i) {
  const open = S.open.has(i.id); const t = threadOf(i.id); const un = unreadOf(i.id);
  const nm = i.link ? `<a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.name)}</a>` : esc(i.name);
  const sym = i.section === "missing" ? "🔴 " : i.section === "unknown" ? "⚫ " : "";
  const name = sym + (i.bold ? `<strong>${nm}</strong>` : nm);
  let meta = "";
  if (i.origin === "manual") meta = i.due ? `Due ${esc(i.due)}` : "";
  else if (i.section === "todo") meta = i.reminder ? `<span class="chip">Study reminder</span> ${esc(i.due)}` : (i.due ? `Due ${esc(i.due)} ${esc(i.tag)}` : "No due date");
  else meta = i.due ? `Due ${esc(i.due)}` : "";
  const rev = MODE === "parent" && needsReview(i.id) ? `<span class="chip rev">Needs review</span>` : "";
  const label = open ? "Close" : (MODE === "kid" ? "💬 Reply" : "💬 Message or set status");
  const talk = (t.length ? t.map(msgView).join("") : `<p class="none">No messages yet</p>`)
    + `<button class="toggle" data-act="toggle" data-id="${esc(i.id)}" aria-expanded="${open}">${label}</button>`;
  return `<article class="card ${i.section}" id="card-${sid(i.id)}">
    <div class="c-course">${i.cls ? `<div class="cls">${esc(i.cls)}</div>` : `<div class="cls none-cls">—</div>`}</div>
    <div class="c-item"><div class="name">${name}</div>${i.detail ? `<div class="detail">${br(i.detail)}</div>` : ""}</div>
    <div class="c-due">${meta ? `<div class="meta">${meta}</div>` : ""}${rev}</div>
    <div class="c-talk thread"${un && !PREVIEW ? ` data-unread="${esc(i.id)}"` : ""}>${talk}</div>
    ${open ? `<div class="c-compose">${MODE === "kid" ? kidComposer(i) : parentComposer(i)}</div>` : ""}
  </article>`;
}

function whoLabel(a) { return a === "parent" ? (MODE === "kid" ? "Mom" : "You") : a === "kyan" ? "Kyan" : "Mckinley"; }
function replyLabel(m) {
  const kid = whoLabel(m.author);
  if (m.applied_from) return MODE === "kid" ? `${kid} (from your reply at the top)` : `${kid} · from a reply about several items`;
  if (m.entered_by !== "parent") return kid;
  return MODE === "kid" ? `${kid} (told Mom)` : `${kid} · typed in by you`;
}
function noteWho(m, item) {
  if (m.note_by === "parent") return MODE === "kid" ? "Mom's words" : "your words";
  const kid = item ? item.student : "student";
  return MODE === "kid" ? "your words" : `${kid}'s words`;
}
function statusLine(m) {
  const item = S.items.find(i => i.id === m.item_id);
  const note = m.body ? ` — “${esc(m.body)}” <span class="tx" style="display:inline">(${noteWho(m, item)})</span>` : "";
  if (MODE === "parent") return `Status: ${esc(m.status)}${note}`;
  return ({ "student says done": "Noted: you said it's done", "I confirm done": "Confirmed done", "plan note": "Plan noted", "status note": "Noted",
    "settled: done": "Settled: done", "excused": "Excused", "no count": "No count" }[m.status] || esc(m.status)) + note;
}
function msgView(m) {
  if (m.kind === "status") return `<div class="msg status">✔ ${statusLine(m)}<span class="who">— ${whoLabel(m.author)}, ${when(m.created_at)}</span></div>`;
  const cls = m.author === "parent" ? "parent" : "kid";
  const isNew = MODE === "kid" && m.author === "parent" && !m.read_by_student_at;
  const hasClip = m.audio_path || m.has_audio;
  let clip = "";
  if (hasClip) {
    clip = MODE === "parent" ? `<audio controls preload="none" id="clip-${m.id}"></audio>` : `<div class="tx">🎙 Voice reply sent</div>`;
    clip += `<div class="tx">Transcript: ${m.transcript ? esc(m.transcript) : "<em>no transcript</em>"}</div>`;
  }
  return `<div class="msg ${cls}"><span class="who">${isNew ? '<span class="newtag">New</span> ' : ""}${m.kind === "reply" ? replyLabel(m) : whoLabel(m.author)} · ${when(m.created_at)}</span>${m.body ? br(m.body) : ""}${clip}</div>`;
}

function kidComposer(i) {
  if (PREVIEW) return `<p class="tx">Replies are turned off in preview. Here, ${esc(i.student)} sees a box to type a reply.</p>`;
  const id = i.id, k = sid(id);
  return `<div class="composer">
    <label class="f" for="d-${k}">Reply about this item, as ${esc(S.student)}</label>
    <textarea id="d-${k}" data-draft="${esc(id)}" placeholder="Type a reply…">${esc(S.drafts[id] || "")}</textarea>
    <div class="row"><button class="btn" data-act="send" data-id="${esc(id)}">Send</button></div>
    <div class="tx">${MIC_TIP}</div></div>`;
}

function parentComposer(i) {
  const id = i.id, k = sid(id), kid = i.student;
  const sp = S.speaker[id] || "me";
  let html = `<div class="composer">
    <div class="seg" role="radiogroup" aria-label="Who is speaking">
      <label><input type="radio" name="sp-${k}" data-speaker="${esc(id)}" value="me" ${sp === "me" ? "checked" : ""}> Message to ${esc(kid)}</label>
      <label><input type="radio" name="sp-${k}" data-speaker="${esc(id)}" value="kid" ${sp === "kid" ? "checked" : ""}> ${esc(kid)} told me</label>
    </div>
    <textarea id="d-${k}" data-draft="${esc(id)}" aria-label="${sp === "me" ? `Message to ${esc(kid)}` : `What ${esc(kid)} told you`}" placeholder="${sp === "me" ? "What's expected…" : `What ${esc(kid)} said, in their words…`}">${esc(S.drafts[id] || "")}</textarea>
    <div class="row"><button class="btn" data-act="pmsg" data-id="${esc(id)}">${sp === "me" ? "Send message" : `Save as ${esc(kid)}'s reply`}</button></div></div>`;
  if (i.origin === "tracker") {
    const opts = STATUSES.filter(s => s !== "settled: done" || i.section === "followup");
    const cur = S.statusSel[id] || "";
    const lr = lastReply(id);
    const need = NOTE_STATUSES.includes(cur);
    const nb = S.noteBy[id] || "parent";
    html += `<div class="statusbox"><label class="f" for="s-${k}">Set a status${lr && needsReview(id) ? " (answers the latest reply)" : ""}</label>
      <select id="s-${k}" data-statussel="${esc(id)}"><option value="">Choose…</option>${opts.map(s => `<option ${s === cur ? "selected" : ""}>${esc(s)}</option>`).join("")}</select>
      <label class="f" for="n-${k}">${need ? "Note (needed for this status)" : "Note (optional)"}</label>
      <textarea id="n-${k}" data-notetext="${esc(id)}" placeholder="Add a note…">${esc(S.noteText[id] || "")}</textarea>
      <div class="seg" role="radiogroup" aria-label="Whose words is the note">
        <label><input type="radio" name="nb-${k}" data-noteby="${esc(id)}" value="parent" ${nb === "parent" ? "checked" : ""}> My words</label>
        <label><input type="radio" name="nb-${k}" data-noteby="${esc(id)}" value="student" ${nb === "student" ? "checked" : ""}> ${esc(kid)}'s words</label>
      </div>
      ${lr && (lr.body || lr.transcript) ? `<div class="row"><button class="btn ghost small" data-act="usereply" data-id="${esc(id)}">Use ${esc(kid)}'s last reply as the note</button></div>` : ""}
      <div class="row"><button class="btn" data-act="pstatus" data-id="${esc(id)}" ${cur ? "" : "disabled"}>Save status</button></div></div>`;
  } else {
    if (S.editing === id) {
      html += `<div class="form statusbox"><label class="f">Title<input type="text" id="et-${k}" value="${esc(i.name)}"></label>
        <label class="f">Due date (optional)<input type="date" id="ed-${k}" value="${/^\d{4}-\d\d-\d\d$/.test(i.sort) ? esc(i.sort) : ""}"></label>
        <label class="f">Details (optional)<textarea id="ex-${k}">${esc(i.detail)}</textarea></label>
        <div class="row"><button class="btn" data-act="saveitem" data-id="${esc(id)}">Save</button><button class="btn ghost" data-act="canceledit">Cancel</button></div></div>`;
    } else {
      html += `<div class="row statusbox"><button class="btn ghost small" data-act="edititem" data-id="${esc(id)}">Edit</button>
        <button class="btn ghost small" data-act="archive" data-id="${esc(id)}">Archive</button></div>`;
    }
  }
  return html;
}

function addForm(st, k) {
  if (S.adding !== k) return `<div class="row" style="margin-bottom:10px"><button class="btn ghost" data-act="addopen" data-sec="${k}">+ Add an item</button></div>`;
  return `<div class="card ${k} addcard" style="margin-bottom:12px"><h2>New ${k === "college" ? "College Apps" : "Other"} item for ${esc(st)}</h2>
    <div class="form"><label class="f">Title<input type="text" id="nt"></label>
    <label class="f">Due date (optional)<input type="date" id="nd"></label>
    <label class="f">Details (optional)<textarea id="nx"></textarea></label>
    <div class="row"><button class="btn" data-act="additem">Add</button><button class="btn ghost" data-act="addcancel">Cancel</button></div></div></div>`;
}

// ---------- actions ----------
async function act(a, el) {
  const id = el.dataset.id;
  switch (a) {
    case "dismiss": S.notice = ""; render(); break;
    case "refresh": S.notice = ""; await load(); break;
    case "sw": S.student = el.dataset.st; ls.set("hub-student", S.student); S.adding = null; S.editing = null; render(); if (MODE === "parent") loadClips(); break;
    case "review": S.review = !S.review; render(); break;
    case "toggle":
      if (S.open.has(id)) S.open.delete(id); else { S.open.add(id); markRead(id, true); }
      render(); break;
    case "send": {
      const body = (S.drafts[id] || "").trim(); if (!body) { notice("Type a reply first."); return; }
      el.disabled = true;
      const { error } = await sb.rpc("kid_reply", { p_token: TOKEN, p_item_id: id, p_author: S.student.toLowerCase(), p_body: body });
      if (error) { el.disabled = false; notice("Couldn't send: " + error.message); return; }
      S.drafts[id] = ""; S.open.delete(id); S.notice = "Sent."; await load(); break;
    }
    case "gsend": {
      const body = (S.general || "").trim(); if (!body) { notice("Type a reply first."); return; }
      el.disabled = true;
      const { error } = await sb.rpc("kid_general_reply", { p_token: TOKEN, p_author: S.student.toLowerCase(), p_body: body });
      if (error) { el.disabled = false; notice("Couldn't send: " + error.message); return; }
      S.general = ""; S.notice = "Sent. Mom will match it to the right items."; await load(); break;
    }
    case "apply": {
      const g = S.msgs.find(m => m.id === id); const sel = [...(S.applySel[id] || [])]; if (!g || !sel.length) return;
      el.disabled = true;
      const t = new Date().toISOString();
      const rows = sel.map(item_id => ({ item_id, author: g.author, kind: "reply", body: g.body, entered_by: "parent", applied_from: g.id, read_by_parent_at: t }));
      const { error } = await sb.from("messages").insert(rows);
      if (error) { el.disabled = false; notice("Couldn't apply: " + error.message); return; }
      const { error: e2 } = await sb.from("messages").update({ sorted_at: t, read_by_parent_at: t }).eq("id", g.id);
      delete S.applySel[id];
      S.notice = e2 ? "Copied onto the items, but couldn't mark the reply sorted: " + e2.message : `Applied to ${sel.length} item${sel.length === 1 ? "" : "s"}. They now show "Needs review".`;
      await load(); break;
    }
    case "sortnone": {
      if (!confirm("Mark this reply as sorted without putting it on any item?")) return;
      const t = new Date().toISOString();
      const { error } = await sb.from("messages").update({ sorted_at: t, read_by_parent_at: t }).eq("id", id);
      if (error) { notice("Couldn't mark it sorted: " + error.message); return; }
      delete S.applySel[id]; S.notice = "Marked sorted."; await load(); break;
    }
    case "pmsg": {
      const body = (S.drafts[id] || "").trim(); if (!body) { notice("Type something first."); return; }
      const item = S.items.find(x => x.id === id);
      const asKid = (S.speaker[id] || "me") === "kid";
      el.disabled = true;
      const row = asKid
        ? { item_id: id, author: item.student.toLowerCase(), kind: "reply", body, entered_by: "parent", read_by_parent_at: new Date().toISOString() }
        : { item_id: id, author: "parent", kind: "message", body };
      const { error } = await sb.from("messages").insert(row);
      if (error) { el.disabled = false; notice("Couldn't save: " + error.message); return; }
      S.drafts[id] = ""; S.notice = asKid ? `Saved as ${item.student}'s reply.` : "Message sent."; await load(); break;
    }
    case "usereply": {
      const lr = lastReply(id); if (!lr) return;
      S.noteText[id] = lr.body || lr.transcript || ""; S.noteBy[id] = "student"; render(); break;
    }
    case "pstatus": {
      const status = S.statusSel[id]; if (!status) return;
      const lr = lastReply(id);
      const body = (S.noteText[id] || "").trim() || null;
      if (NOTE_STATUSES.includes(status) && !body) { notice("This status needs a note. Type one, or use the last reply."); return; }
      el.disabled = true;
      const { error } = await sb.from("messages").insert({ item_id: id, author: "parent", kind: "status", status, body,
        note_by: body ? (S.noteBy[id] || "parent") : null, reply_to: lr && needsReview(id) ? lr.id : null });
      if (error) { el.disabled = false; notice("Couldn't save the status: " + error.message); return; }
      delete S.statusSel[id]; delete S.noteText[id]; delete S.noteBy[id]; S.open.delete(id); S.notice = `Status saved: ${status}.`; await load(); break;
    }
    case "copyledger": await copyLedger(); break;
    case "markcopied": await markCopied(S.fallback.ids); S.fallback = null; render(); break;
    case "cancelcopy": S.fallback = null; render(); break;
    case "addopen": S.adding = el.dataset.sec; render(); break;
    case "addcancel": S.adding = null; render(); break;
    case "additem": {
      const name = document.getElementById("nt").value.trim(); const d = document.getElementById("nd").value; const detail = document.getElementById("nx").value.trim();
      if (!name) { notice("Give the item a title."); return; }
      const { error } = await sb.from("items").insert({ student: S.student, section: S.adding, origin: "manual", name, due: dueText(d), sort: d || "~", detail });
      if (error) { notice("Couldn't add: " + error.message); return; }
      S.adding = null; S.notice = "Added."; await load(); break;
    }
    case "edititem": S.editing = id; render(); break;
    case "canceledit": S.editing = null; render(); break;
    case "saveitem": {
      const k = sid(id); const name = document.getElementById("et-" + k).value.trim(); const d = document.getElementById("ed-" + k).value; const detail = document.getElementById("ex-" + k).value.trim();
      if (!name) { notice("The title can't be empty."); return; }
      const { error } = await sb.from("items").update({ name, due: dueText(d), sort: d || "~", detail }).eq("id", id);
      if (error) { notice("Couldn't save: " + error.message); return; }
      S.editing = null; S.notice = "Saved."; await load(); break;
    }
    case "archive": {
      if (!confirm("Archive this item? It disappears from both views.")) return;
      const { error } = await sb.from("items").update({ archived_at: new Date().toISOString() }).eq("id", id);
      if (error) { notice("Couldn't archive: " + error.message); return; }
      S.open.delete(id); S.notice = "Archived."; await load(); break;
    }
    case "signin": {
      const email = document.getElementById("email").value.trim();
      const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false, emailRedirectTo: SITE } });
      notice(error ? "Couldn't send the link: " + error.message : "Check your email for the sign-in link. Open it on this device.");
      break;
    }
    case "signout": await sb.auth.signOut(); S.items = []; S.msgs = []; S.phase = "signin"; render(); break;
  }
}

async function copyLedger() {
  const items = byId(); const pending = ledgerPending(items, S.msgs);
  if (!pending.length) return;
  const text = ledgerText(items, pending, new Date());
  const ids = pending.map(m => m.id);
  try { await navigator.clipboard.writeText(text); }
  catch (e) { S.fallback = { text, ids }; render(); const p = document.getElementById("fbtext"); if (p) { const r = document.createRange(); r.selectNodeContents(p); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } return; }
  await markCopied(ids);
  notice(`Copied ${ids.length} line${ids.length === 1 ? "" : "s"} — paste into Option 1's <new_info>.`);
}
async function markCopied(ids) {
  const t = new Date().toISOString();
  const { error } = await sb.from("messages").update({ copied_at: t }).in("id", ids);
  if (error) { S.notice = "Copied, but couldn't mark them as copied: " + error.message; return; }
  S.msgs.forEach(m => { if (ids.includes(m.id)) m.copied_at = t; });
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  e.preventDefault(); act(b.dataset.act, b);
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.draft !== undefined) S.drafts[t.dataset.draft] = t.value;
  if (t.dataset.notetext !== undefined) S.noteText[t.dataset.notetext] = t.value;
  if (t.dataset.general !== undefined) S.general = t.value;
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.statussel !== undefined) { S.statusSel[t.dataset.statussel] = t.value; render(); }
  if (t.dataset.speaker !== undefined) { S.speaker[t.dataset.speaker] = t.value; render(); }
  if (t.dataset.noteby !== undefined) { S.noteBy[t.dataset.noteby] = t.value; render(); }
  if (t.dataset.pick !== undefined) {
    const g = t.dataset.pick; const s = S.applySel[g] || (S.applySel[g] = new Set());
    if (t.checked) s.add(t.value); else s.delete(t.value);
    render();
  }
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.phase === "ready") load(); });

// ---------- start ----------
(async () => {
  if (MODE === "kid") { await load(); return; }
  const { data } = await sb.auth.getSession();
  S.session = data.session;
  sb.auth.onAuthStateChange((ev, session) => {
    const had = !!S.session; S.session = session;
    if (session && !had) { S.phase = "loading"; render(); load(); }
    if (!session && had) { S.phase = "signin"; render(); }
  });
  if (S.session) await load(); else { S.phase = "signin"; render(); }
})();
</script>
